[package]
name = "rhai-ml"
version = "0.1.4"
edition = "2021"
authors = ["Chris McComb <ccmcc2012@gmail.com>"]
description = "Machine learning in the Rhai scripting language"
repository = "https://github.com/rhaiscript/rhai-ml"
homepage = "https://github.com/rhaiscript/rhai-ml"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["scripting", "rhai", "machine-learning", "scripting-language", "smartcore"]
categories = ["algorithms", "science"]
documentation = "https://docs.rs/rhai-ml"
build = "build.rs"

[features]
default = []
metadata = ["rhai/metadata"]

[dependencies]
rhai = "1.16.2"
smartstring = "1.0"
smartcorelib = { version = "0.3.2", package = "smartcore", features = ["serde"] }
bincode = "1.3.3"

[build-dependencies]
rhai = "1.16.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
smartstring = "1.0"
smartcorelib = { version = "0.3.2", package = "smartcore", features = ["serde"] }
bincode = "1.3.3"

[package.metadata.docs.rs]
all-features = true
